name: CI

on:
  push:
    branches: [master, ameliorations]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Base PostgreSQL jetable, créée pour chaque exécution puis détruite : les
    # tests E2E parcourent le vrai site (accueil, catalogue…) qui lit la base.
    # Ne jamais mettre ici une URL de production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jeune_riche
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d jeune_riche"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jeune_riche
      DIRECT_URL: postgresql://ci:ci@localhost:5432/jeune_riche
      NEXT_PUBLIC_SITE_URL: https://example.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Vérifie aussi au passage que toutes les migrations s'appliquent sur
      # une base vide, dans l'ordre — exactement ce que fera la production.
      - name: Migrations
        run: npx prisma migrate deploy

      # Catégories + produits en brouillon (non publiés) : c'est l'état
      # attendu par tests/navigation.spec.ts.
      - name: Données de départ
        run: npm run seed

      - name: Build
        run: npx next build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test tests/navigation.spec.ts

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
